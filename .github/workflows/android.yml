name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check translations (en, ru, tr, de)
        run: python3 scripts/i18n/gen_strings.py --check

      - name: Unit, integration and Robolectric UI tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Decode release keystore (only if the secret is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ELOA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build debug and release APKs
        env:
          ELOA_STOREFILE: ${{ secrets.ELOA_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          ELOA_STOREPASSWORD: ${{ secrets.ELOA_STORE_PASSWORD }}
          ELOA_KEYALIAS: ${{ secrets.ELOA_KEY_ALIAS }}
          ELOA_KEYPASSWORD: ${{ secrets.ELOA_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Checksums
        run: |
          cd app/build/outputs/apk
          find . -name "*.apk" -exec sha256sum {} \; | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.html
